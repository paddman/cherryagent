name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect and generate patched production dependency lock
        run: |
          npm ls brace-expansion || true
          npm view brace-expansion@1.1.17 version dist.integrity dist.tarball --json || true
          npm view brace-expansion@2.1.3 version dist.integrity dist.tarball --json || true
          npm audit fix --force --package-lock-only || true
          git diff -- package-lock.json
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cherry-ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cherry-ai-worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
